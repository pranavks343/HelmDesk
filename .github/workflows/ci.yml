name: CI

# agents.md §3 puts this at infra/.github/workflows/ci.yml, but GitHub Actions only ever reads
# workflows from <repo-root>/.github/workflows/ - this lives here so it actually runs; see
# README.md's "Deviations from agents.md" section.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: mypy .
      - run: pytest -q

  lint-and-test-agent-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/agent-worker/requirements.txt
      - run: pip install -r requirements.txt
      - name: generate gRPC stubs
        run: |
          mkdir -p pb
          python -m grpc_tools.protoc -I ../../proto --python_out=pb --grpc_python_out=pb --pyi_out=pb ../../proto/ticket.proto
          touch pb/__init__.py
      - run: ruff check .
      - run: mypy .
      - run: pytest -q

  lint-and-test-notifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/notifier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/notifier/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  lint-and-test-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build

  build-images:
    needs:
      - lint-and-test-api
      - lint-and-test-agent-worker
      - lint-and-test-notifier
      - lint-and-test-web
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile
          - name: agent-worker
            context: .
            dockerfile: ./apps/agent-worker/Dockerfile
          - name: notifier
            context: .
            dockerfile: ./apps/notifier/Dockerfile
          - name: web
            context: ./web
            dockerfile: ./web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: supportpilot-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # On merge to main: build + push images (tag = short SHA). Stops here - actual cloud deploy is
  # left as a documented manual/optional stretch goal (agents.md §10, §13).
  push-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile
          - name: agent-worker
            context: .
            dockerfile: ./apps/agent-worker/Dockerfile
          - name: notifier
            context: .
            dockerfile: ./apps/notifier/Dockerfile
          - name: web
            context: ./web
            dockerfile: ./web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
