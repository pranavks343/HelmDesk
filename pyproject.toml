[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supportpilot"
version = "2.0.0"
description = "SupportPilot v2 - a LangGraph multi-agent support desk (31 concepts)"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite",
  "langchain-core>=1.0",
  "langchain-anthropic>=1.0",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13",
  "python-dotenv>=1.0",
  "aiosqlite>=0.20",
  "sqlite-vec>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff", "mypy"]
studio = ["langgraph-cli[inmem]"]

[project.scripts]
supportpilot = "supportpilot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
supportpilot = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = ["live: hits the real Anthropic API (needs ANTHROPIC_API_KEY)"]
addopts = "-m 'not live' -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "evals", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
plugins = ["pydantic.mypy"]
files = ["src/supportpilot"]

# demos.py deliberately builds ad-hoc dicts/tuples/(role, text) message shorthands and monkeypatches
# module internals for 31 short, self-contained scripted demos (§14) - it's glue over the typed
# library below, not part of the typed surface itself. Pregel.invoke's overload set also can't be
# satisfied by a loosely-typed convenience wrapper like this without per-call annotations that
# would make each demo far longer for no safety benefit (the real invoke call sites, in nodes/ and
# subgraphs/, are fully typed and mypy-clean). cli.py has the same convenience-wrapper shape for
# its digest() command; the rest of cli.py is fully typed.
[[tool.mypy.overrides]]
module = "supportpilot.demos"
ignore_errors = true

[tool.coverage.run]
source = ["src/supportpilot"]
omit = ["src/supportpilot/llm/anthropic.py"]
